  <style>
    body {
      background-color: #f9f9f9;
    }

    header {
      background-color: #00023D;
      color: white;
      padding: 3rem 1rem;
      text-align: center;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: inherit;
      filter: blur(100px) brightness(0.4);
      transition: opacity 0.5s;
    }

    .brand-pill {
      display: inline-flex;
      gap: .5rem;
      align-items: center;
      padding: .35rem .75rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .18);
      backdrop-filter: blur(10px);
      font-weight: 600;

    header>* {

      z-index: 1;

    #result-theme {
      user-select: none;
      line-height: 1.2;
      word-break: break-word;
    }

    .neighbor-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: .5rem;
    }

    .neighbor-name {
      flex: 0 0 38%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .neighbor-sim {
      flex: 0 0 3.2em;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .soc-icon {
      position: relative;
      font-size: 26px;
      line-height: 1;
      color: #333333;
      padding: 0 10px 15px;
      text-decoration: none;
    }

    footer>div>p {
      margin-bottom: 20px;
    }

    #footer-contacts {

    }
  </style>

<body>
  <header class="animate__animated animate__fadeInDown">
    <div class="container">

        <div class="brand-pill">
          <i class="fa-solid fa-shuffle"></i>

        <h1 class="display-5 fw-bold mb-0">GameJam主题抽取器</h1>

      <p class="mb-0" style="text-indent:2em;">
        想不出做什么主题？点一下「随机抽取」碰碰运气；
        也可以在下方输入你想要的描述，让抽取结果更贴近你的想法（加权抽取需要先加载模型，可以点下方按钮提前准备）。

    <div class="card shadow-sm animate__animated animate__fadeInUp mb-4" id="result-card">

        <h2 id="result-theme" class="fw-bold text-center">？</h2>
        <p class="text-secondary small mb-3 text-center" id="result-meta">点击下方按钮，抽取你的主题</p>
        <h6 class="text-secondary mb-2">最相近的主题</h6>
        <div id="result-neighbors"></div>
      </div>
    </div>

    <div class="card shadow-sm animate__animated animate__fadeInUp">
      <div class="card-body">
        <label for="prompt-input" class="form-label fw-bold">提示词（仅「加权抽取」使用）</label>
        <textarea id="prompt-input" class="form-control" rows="2"
          placeholder="描述你想要的主题方向，例如：想做一个发生在深海、带有治愈感的游戏"></textarea>
        <div class="d-flex align-items-center gap-2 mt-3 flex-wrap">
          <button id="btn-random" type="button" class="btn btn-primary rounded-pill px-3" disabled>随机抽取</button>

            <button id="btn-download" type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3">加载模型</button>

  <script src="../js/font/fontawesome.min.js"></script>

  <script type="module">
    // ---------- 向量池加载与解码 ----------
    const state = {
      themes: [],
      vectors: [],      // Float32Array[]
      dim: 0,
      model: '',
      pooling: 'mean',
    };

    function decodeVector(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Float32Array(bytes.buffer);
    }

    function dot(a, b) {
      let s = 0;
      for (let i = 0; i < a.length; i++) s += a[i] * b[i];
      return s;
    }

    function topK(v, k = 5) {
      return state.themes
        .map((theme, i) => ({ theme, sim: dot(v, state.vectors[i]) }))
        .sort((a, b) => b.sim - a.sim)
        .slice(0, k);
    }

    function weightedSample(sims, temperature) {
      const max = Math.max(...sims);
      const w = sims.map(s => Math.exp((s - max) / temperature));
      const sum = w.reduce((a, b) => a + b, 0);
      let r = Math.random() * sum;
      for (let i = 0; i < w.length; i++) {
        r -= w[i];
        if (r <= 0) return i;
      }
      return w.length - 1;
    }

    // ---------- 懒加载 Prompt 编码模型（全同源自托管） ----------
    let extractorPromise = null;
    const nativeFetch = window.fetch.bind(window); // 原生 fetch：模块加载时捕获，重试时不会捕获到旧拦截器
    const statusEl = document.getElementById('model-status');
    const progressWrap = document.getElementById('model-progress-wrap');
    const progressBar = document.getElementById('model-progress-bar');
    const progressLabel = document.getElementById('model-progress-label');
    const progressPct = document.getElementById('model-progress-pct');

    const fmtMB = (bytes) => (bytes / 1024 / 1024).toFixed(1);
    const fmtTime = (sec) => {
      sec = Math.max(0, Math.round(sec));
      return sec < 60 ? `${sec}s` : `${Math.floor(sec / 60)}m${String(sec % 60).padStart(2, '0')}s`;
    };

    // pct == null 表示不确定进度（探测 / 缓存命中 / 初始化阶段），显示条纹动画条
    function showProgress(label, pct) {
      progressWrap.classList.remove('d-none');
      progressLabel.textContent = label;
      if (pct == null) {
        progressBar.classList.add('progress-bar-striped', 'progress-bar-animated');
        progressBar.style.width = '100%';
        progressPct.textContent = '';
      } else {
        progressBar.classList.remove('progress-bar-striped', 'progress-bar-animated');
        progressBar.style.width = pct.toFixed(1) + '%';
        progressPct.textContent = pct.toFixed(0) + '%';
      }
    }

    function hideProgress() { progressWrap.classList.add('d-none'); }

    function getExtractor() {
      if (!extractorPromise) {
        extractorPromise = (async () => {
          statusEl.textContent = '模型：加载中…';
          statusEl.className = 'badge text-bg-warning';

          // 探测模型是否已在 transformers.js 的浏览器缓存中（Cache API，不受 DevTools「禁用缓存」影响）
          let fromCache = false;
          try {
            if ('caches' in window && (await caches.keys()).includes('transformers-cache')) {
              const cache = await caches.open('transformers-cache');
              fromCache = (await cache.keys()).some(r => r.url.includes('model_quantized.onnx'));
            }
          } catch { /* 缓存不可用时忽略 */ }
          showProgress(fromCache ? '从浏览器缓存读取模型…' : '加载推理组件…', null);

          // 读取构建时生成的分片清单（记录文件的原始字节数）。
          // GitHub Pages 等会对 onnx 启用 gzip 传输：响应的 Content-Length 是压缩后的大小，
          // 而 fetch 读到的是解压后的字节，两者口径不一致，进度分母只能用 manifest 的真实字节数。
          let manifest = null;
          try {
            const resp = await nativeFetch(`model/${state.model}/onnx/manifest.json`);
            if (resp.ok) manifest = await resp.json();
          } catch { /* 无清单时回退为下载中逐步发现分片 */ }
          const shardCount = manifest ? manifest.shards.length : 0;
          let totalBytes = manifest ? manifest.totalBytes : 0;

          // 模型 onnx 超过 GitHub 单文件 100MB 上限，以分片部署，此处拦截请求并在浏览器端合并
          let downloaded = 0;
          let speed = 0, lastTick = performance.now(), lastBytes = 0;
          let componentBytes = 0; // 推理组件（wasm / tokenizer 等）累计下载字节

          window.fetch = async (input, init) => {
            const url = typeof input === 'string' ? input : input && input.url;
            let pathname = '';
            if (typeof url === 'string') {
              try { pathname = new URL(url, location.href).pathname; } catch { pathname = url; }
            }
            // 精确匹配未分片的 onnx 请求（不能模糊 includes，否则会误匹配分片 URL）
            if (pathname.endsWith('/onnx/model_quantized.onnx')) {
              const buffers = [];
              let confirmed = 0; // 已完成分片的真实字节数（无 manifest 时作为分母依据）
              for (let i = 0; ; i++) {
                if (shardCount && i >= shardCount) break; // manifest 已记录全部分片
                const shardURL = shardCount
                  ? `model/${state.model}/onnx/${manifest.shards[i].file}`
                  : `model/${state.model}/onnx/model_quantized.onnx.${i}`;
                const resp = await nativeFetch(shardURL);
                if (!resp.ok) {
                  if (i === 0) throw new Error('模型分片未找到');
                  break;
                }
                if (resp.body) { // 流式下载，逐块更新进度
                  const reader = resp.body.getReader();
                  const chunks = [];
                  let shardBytes = 0;
                  for (;;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    shardBytes += value.byteLength;
                    downloaded += value.byteLength;
                    // 无清单时按已读字节自校正分母（gzip 下 Content-Length 与解压字节口径不一致）
                    if (!shardCount && confirmed + shardBytes > totalBytes) totalBytes = confirmed + shardBytes;
                    const now = performance.now();
                    if (now - lastTick > 500) { // 每 500ms 平滑测速
                      speed = ((downloaded - lastBytes) / (now - lastTick)) * 1000;
                      lastTick = now; lastBytes = downloaded;
                    }
                    const extra = speed ? `（${fmtMB(speed)} MB/s，剩余 ${fmtTime((totalBytes - downloaded) / speed)}）` : '';
                    showProgress(
                      totalBytes ? `下载中 ${fmtMB(downloaded)} / ${fmtMB(totalBytes)} MB${extra}` : `下载中 ${fmtMB(downloaded)} MB`,
                      totalBytes ? Math.min(100, downloaded / totalBytes * 100) : null,
                    );
                  }
                  confirmed += shardBytes;
                  if (!shardCount) totalBytes = confirmed; // 分片完成，真实字节已知
                  const merged = new Uint8Array(chunks.reduce((s, c) => s + c.byteLength, 0));
                  let off = 0;
                  for (const c of chunks) { merged.set(c, off); off += c.byteLength; }
                  buffers.push(merged);
                } else {
                  const buf = await resp.arrayBuffer();
                  buffers.push(buf);
                  downloaded += buf.byteLength;
                  confirmed += buf.byteLength;
                }
              }
              if (!buffers.length) throw new Error('模型分片未找到');
              const blob = new Blob(buffers, { type: 'application/octet-stream' });
              statusEl.textContent = '模型：初始化推理引擎…';
              showProgress('初始化推理引擎…', null);
              return new Response(blob, {
                status: 200,
                headers: { 'Content-Length': String(blob.size) },
              });
            }
            // 推理组件（wasm / tokenizer / 配置）：流式转发并累计字节，让组件阶段也有进度反馈
            {
              if (pathname.endsWith('.wasm') || pathname.includes('tokenizer') || pathname.endsWith('config.json')) {
                const resp = await nativeFetch(input, init);
                if (resp.ok && resp.body) {
                  const reader = resp.body.getReader();
                  const chunks = [];
                  for (;;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    componentBytes += value.byteLength;
                    const prefix = fromCache ? '从缓存读取模型，加载推理组件' : '加载推理组件';
                    showProgress(`${prefix}（已下载 ${fmtMB(componentBytes)} MB）…`, null);
                  }
                  const merged = new Uint8Array(chunks.reduce((s, c) => s + c.byteLength, 0));
                  let off = 0;
                  for (const c of chunks) { merged.set(c, off); off += c.byteLength; }
                  return new Response(merged, {
                    status: resp.status,
                    headers: {
                      'Content-Type': resp.headers.get('Content-Type') || 'application/octet-stream',
                      'Content-Length': String(merged.byteLength),
                    },
                  });
                }
                return resp;
              }
            }
            return nativeFetch(input, init);
          };
          const { pipeline, env } = await import('./js/transformers.min.js');
          env.allowLocalModels = true;
          env.allowRemoteModels = false;   // 全部资源同源部署，无需远程回退
          env.localModelPath = 'model/';
          env.backends.onnx.wasm.wasmPaths = 'js/'; // wasm 运行时同源自托管（默认指向 jsdelivr CDN）
          const extractor = await pipeline('feature-extraction', state.model);
          statusEl.textContent = '模型：就绪';
          statusEl.className = 'badge text-bg-success';
          hideProgress();
          return extractor;
        })().catch(err => {
          extractorPromise = null;
          statusEl.textContent = '模型：加载失败（' + err.message + '），请重试';
          statusEl.className = 'badge text-bg-danger';
          hideProgress();
          throw err;
        });
      }
      return extractorPromise;
    }

    // ---------- 渲染 ----------
    const resultBody = document.querySelector('#result-card .card-body');
    const resultLabel = document.getElementById('result-label');
    const resultTheme = document.getElementById('result-theme');
    const resultMeta = document.getElementById('result-meta');
    const resultNeighbors = document.getElementById('result-neighbors');

    function render(label, theme, meta, neighbors) {
      resultLabel.textContent = label;
      resultTheme.textContent = theme;
      resultMeta.textContent = meta;
      resultNeighbors.innerHTML = '';
      neighbors.forEach(({ theme: n, sim }, idx) => {
        const row = document.createElement('div');
        row.className = 'neighbor-row';
        const pct = Math.max(0, Math.min(100, Math.round(sim * 100)));
        row.innerHTML = `
          <span class="neighbor-name small ${idx === 0 ? 'fw-bold' : 'text-secondary'}" title="${n}">${n}</span>
          <div class="progress flex-grow-1" style="height:8px">
            <div class="progress-bar ${idx === 0 ? '' : 'bg-secondary'}" style="width:${pct}%"></div>
          </div>
          <span class="neighbor-sim small text-secondary">${sim.toFixed(3)}</span>`;
      resultNeighbors.appendChild(row);
      });
      resultBody.classList.remove('animate__animated', 'animate__fadeInUp');
      void resultBody.offsetWidth; // 重置动画
      resultBody.classList.add('animate__animated', 'animate__fadeInUp');
    }

    // ---------- 三种抽取 ----------
    const promptInput = document.getElementById('prompt-input');
    const tempInput = document.getElementById('temperature');
    const tempValue = document.getElementById('temp-value');
    tempInput.addEventListener('input', () => tempValue.textContent = Number(tempInput.value).toFixed(2));

    document.getElementById('btn-random').addEventListener('click', () => {
      const i = Math.floor(Math.random() * state.themes.length);
      render('随机抽取', state.themes[i],
        `主题库共 ${state.themes.length} 个主题`,
        topK(state.vectors[i]));
    });

    document.getElementById('btn-prompt').addEventListener('click', async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) {
        promptInput.focus();
        promptInput.classList.add('is-invalid');
        setTimeout(() => promptInput.classList.remove('is-invalid'), 1500);
        return;
      }
      const btn = document.getElementById('btn-prompt');
      btn.disabled = true;
      try {
        const extractor = await getExtractor();
        const output = await extractor(prompt, { pooling: state.pooling, normalize: true });
        const q = output.data; // Float32Array(384)
        const sims = state.vectors.map(v => dot(v, q));
        const temperature = Number(tempInput.value);
        const i = weightedSample(sims, temperature);
        render('加权抽取', state.themes[i],
          `与你的描述「${prompt}」的贴合度 ${sims[i].toFixed(3)} · 随机度 ${temperature.toFixed(2)}`,
          topK(state.vectors[i]));
      } finally {
        btn.disabled = false;
      }
    });

    // 提前下载模型：加载完成后「加权抽取」即点即用
    document.getElementById('btn-download').addEventListener('click', () => {
      const btn = document.getElementById('btn-download');
      btn.disabled = true;
      btn.textContent = '下载中…';
      getExtractor()
        .then(() => { btn.textContent = '模型已就绪'; })
        .catch(() => { btn.disabled = false; btn.textContent = '重试下载'; });
    });

    // ---------- 初始化 ----------
    document.addEventListener('DOMContentLoaded', async () => {
      const e = document.getElementById('footer-contacts');
      if (e) e.style.visibility = '';
      if (typeof WOW === 'function') new WOW().init();
      try {
        const resp = await fetch('../data/themes/vectors.json', { cache: 'no-store' });
        if (!resp.ok) throw new Error('网络错误');
        const pool = await resp.json();
        state.themes = pool.themes;
        state.vectors = pool.vectors.map(decodeVector);
        state.dim = pool.dim;
        state.model = pool.model;
        state.pooling = pool.pooling || 'mean';
        document.getElementById('pool-size').textContent = `主题库：共 ${pool.count} 个主题`;
        document.getElementById('btn-random').disabled = false;
      } catch (err) {
        document.getElementById('pool-size').textContent = '主题库：加载失败';
        resultLabel.textContent = '加载失败';
        resultTheme.textContent = '（主题数据加载失败）';
        resultMeta.textContent = '请检查网络后刷新重试';
      }
    });
  </script>
  <link rel="stylesheet" href="../css/font/fontawesome.min.css" />
  <link rel="stylesheet" href="../css/font/brands.min.css" />
  <link rel="stylesheet" href="../css/font/solid.min.css" />
</body>
